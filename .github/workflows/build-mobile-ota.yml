name: Build Mobile Apps & Silent Live Update

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Compile Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build Android Release AAB (Play Store)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace || true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-3D-Master-Pro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-3D-Master-Pro-Android-AAB
          path: android/app/build/outputs/bundle/release/*.aab
        continue-on-error: true

  build-ios:
    name: 🍏 Compile iOS App Bundle & IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS App & Package IPA
        run: |
          cd ios/App
          pod install || true
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP_DIR=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          echo "Found compiled iOS app at: $APP_DIR"
          mkdir -p ipa_payload/Payload
          cp -R "$APP_DIR" ipa_payload/Payload/
          cd ipa_payload
          zip -r ../Ludo-3D-Master-Pro-iOS.ipa Payload
          cd ..
          zip -r Ludo-3D-Master-Pro-iOS-App.zip "$APP_DIR"
          ls -lh Ludo-3D-Master-Pro-iOS*

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-3D-Master-Pro-iOS-IPA
          path: ios/App/Ludo-3D-Master-Pro-iOS.ipa

      - name: Upload iOS App Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-3D-Master-Pro-iOS-App
          path: ios/App/Ludo-3D-Master-Pro-iOS-App.zip

  publish-release:
    name: 🚀 Publish GitHub Release with APK & iOS
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Ludo-3D-Master-Pro-Android-APK
          path: release_assets

      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: Ludo-3D-Master-Pro-Android-AAB
          path: release_assets
        continue-on-error: true

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: Ludo-3D-Master-Pro-iOS-IPA
          path: release_assets

      - name: Download iOS App Zip
        uses: actions/download-artifact@v4
        with:
          name: Ludo-3D-Master-Pro-iOS-App
          path: release_assets

      - name: Create or Update GitHub Release v1.2.0 with APK and iOS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Listing release assets:"
          ls -lh release_assets/
          gh release delete v1.2.0 --yes || true
          gh release create v1.2.0 release_assets/* \
            --title "Ludo 3D Master Pro - Release v1.2.0 (Android APK & iOS Bundle)" \
            --notes "Official Commercial Release v1.2.0 featuring: Snappy responsive 3D animations, Ludo King scale edge-to-edge camera zoom, complete single-currency royal store with 9 new themes, live ticking seconds lucky wheel, clean uncluttered 300-level saga maps, dedicated defeat vs victory flow with retry match, and silent background updater. Includes compiled Android APK and iOS packages. Developer: Sohel | Raebareli, UP - 229001"
