name: Build Mobile Apps & Silent Live Update

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Compile Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Ensure and Persist Permanent Release Signing Key
        run: |
          if [ ! -f android/app/release-key.jks ]; then
            echo "Generating permanent cryptographic keystore..."
            keytool -genkeypair -v -keystore android/app/release-key.jks -alias ludokey -keyalg RSA -keysize 2048 -validity 10000 -storepass ludomaster3d -keypass ludomaster3d -dname "CN=Sohel, OU=Gaming, O=Ludo3DMasterPro, L=Raebareli, ST=UP, C=IN"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release-key.jks
            git commit -m "chore: persist permanent android release keystore [skip ci]" || true
            git push origin HEAD:main || true
          else
            echo "Permanent release-key.jks is already locked."
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          mkdir -p output_binaries
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" output_binaries/Ludo-3D-Master-Pro.apk
          ls -lh output_binaries/

      - name: Build Android Release AAB (Play Store)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace || true
          AAB_FILE=$(find app/build/outputs/bundle -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ]; then
            echo "Found AAB at: $AAB_FILE"
            cp "$AAB_FILE" output_binaries/Ludo-3D-Master-Pro.aab
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-3D-Master-Pro-Android-APK
          path: android/output_binaries/Ludo-3D-Master-Pro.apk

      - name: Upload Android AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-3D-Master-Pro-Android-AAB
          path: android/output_binaries/Ludo-3D-Master-Pro.aab
          if-no-files-found: warn
        continue-on-error: true

  build-ios:
    name: 🍏 Compile iOS App Bundle & IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS App & Package IPA
        run: |
          cd ios/App
          pod install || true
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP_DIR=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          echo "Found compiled iOS app at: $APP_DIR"
          mkdir -p ipa_payload/Payload
          cp -R "$APP_DIR" ipa_payload/Payload/
          cd ipa_payload
          zip -r ../Ludo-3D-Master-Pro.ipa Payload
          cd ..
          zip -r Ludo-3D-Master-Pro-iOS.zip "$APP_DIR"
          ls -lh Ludo-3D-Master-Pro*

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-3D-Master-Pro-iOS-IPA
          path: ios/App/Ludo-3D-Master-Pro.ipa

      - name: Upload iOS App Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-3D-Master-Pro-iOS-App
          path: ios/App/Ludo-3D-Master-Pro-iOS.zip

  publish-release:
    name: 🚀 Publish GitHub Release with APK & iOS
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Ludo-3D-Master-Pro-Android-APK
          path: release_assets

      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: Ludo-3D-Master-Pro-Android-AAB
          path: release_assets
        continue-on-error: true

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: Ludo-3D-Master-Pro-iOS-IPA
          path: release_assets

      - name: Download iOS App Zip
        uses: actions/download-artifact@v4
        with:
          name: Ludo-3D-Master-Pro-iOS-App
          path: release_assets

      - name: Create or Update GitHub Release with APK and iOS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Listing release assets:"
          ls -lh release_assets/
          APP_VER=$(node -p "require('./package.json').version")
          TAG="v$APP_VER"
          echo "Processing release tag: $TAG"
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" release_assets/* \
            --title "Ludo 3D Master Pro - Release $TAG (Commercial Android & iOS)" \
            --notes "Official Commercial Release $TAG featuring: 500 Total Ludo Saga Levels and 500 Total Snakes & Ladders Stages (200+200 new progressive levels), 10 Brand New 3D Board Themes (Quantum Cyber Matrix, Supernova Starlight, Solar Titan, Chrono Steampunk, Jurassic Dinosaur, Abyssal Void, and Apex Celestial Sovereigns), New Dice & Pawns, Completely Redesigned & Uniform Snakes Adventure Game Card with 'PLAY' button and seamless borders matching all other cards, Buttery Smooth 155ms Ludo Token Hopping with Cosine Easing & Squash/Stretch, Elimination of Artificial AI Pauses for High-Cadence Gameplay, Smooth Non-Glitchy Token Stacking Offsets, and Advanced Dynamic Comeback & Knockout AI Algorithms across both games. Developer: Sohel | Raebareli, UP - 229001"
