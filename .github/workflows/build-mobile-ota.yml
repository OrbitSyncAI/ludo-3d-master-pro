name: Build Mobile Apps & Silent Live Update

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Compile Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build Android Release AAB (Play Store)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace || true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-3D-Master-Pro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-3D-Master-Pro-Android-AAB
          path: android/app/build/outputs/bundle/release/*.aab
        continue-on-error: true

      - name: Create or Update GitHub Release v1.1.0 with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            gh release create v1.1.0 android/app/build/outputs/apk/debug/app-debug.apk \
              --title "Ludo 3D Master Pro - Release v1.1.0 (Commercial Android & iOS)" \
              --notes "Production commercial release featuring 3D Ludo & Snakes with 300 levels, single-currency royal store, casino lucky wheel with live seconds, and offline progress backup. Developer: Sohel | Raebareli, UP - 229001" || gh release upload v1.1.0 android/app/build/outputs/apk/debug/app-debug.apk --clobber
          fi

  build-ios:
    name: 🍏 Compile iOS App Bundle
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Archive (Simulator / Ad-Hoc)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Release CODE_SIGNING_ALLOWED=NO build || true

      - name: Upload iOS Xcode Project
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-3D-Master-Pro-iOS-Project
          path: ios/App/
